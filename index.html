<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>OWTracker — Overwatch Stats & Meta</title>

    <meta
      name="description"
      content="OWTracker is an Overwatch companion for hero statistics, meta rankings, perks and player comparison."
    />

    <meta
      name="theme-color"
      content="#090a0d"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <link
      rel="canonical"
      href="https://owtracker.net/"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="OWTracker — Overwatch Stats & Meta"
    />

    <meta
      property="og:description"
      content="Explore Overwatch hero statistics, meta rankings, perks and player comparisons."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="OWTracker"
    />

    <meta
      property="og:url"
      content="https://owtracker.net/"
    />

    <meta
      property="og:image"
      content="https://owtracker.net/owtracker-og.png"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="OWTracker — Overwatch Stats & Meta"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="OWTracker — Overwatch Stats & Meta"
    />

    <meta
      name="twitter:description"
      content="Explore Overwatch hero statistics, meta rankings, perks and player comparisons."
    />

    <meta
      name="twitter:image"
      content="https://owtracker.net/owtracker-og.png"
    />

    <!-- Icons -->
    <link
      rel="icon"
      type="image/png"
      href="/owtracker-icon.png"
    />

    <link
      rel="apple-touch-icon"
      href="/owtracker-icon.png"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
